<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare Products | BuyKaroYaNahi</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f9fc;
    color:#172033;
}

a{
    text-decoration:none;
    color:inherit;
}

.wrap{
    width:92%;
    max-width:1150px;
    margin:auto;
}

/* NAVBAR */

.nav{
    height:72px;
    background:#fff;
    border-bottom:1px solid #e7ebf2;
    display:flex;
    align-items:center;
}

.nav-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:#2457e6;
}

.back{
    color:#2457e6;
    font-weight:800;
    font-size:14px;
}


/* HERO */

.hero{
    text-align:center;
    padding:55px 0;
    background:linear-gradient(135deg,#eef4ff,#fff);
}

.hero h1{
    font-size:48px;
    margin:12px 0;
}

.hero h1 span{
    color:#2457e6;
}

.hero p{
    color:#687386;
}


/* SELECT AREA */

.select-area{
    background:#fff;
    border:1px solid #e7ebf2;
    border-radius:20px;
    padding:25px;
    margin:35px 0 20px;
}

.select-area h2{
    margin-top:0;
}

.select-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.select-box label{
    display:block;
    font-size:12px;
    font-weight:800;
    color:#687386;
    margin-bottom:7px;
}

select{
    width:100%;
    padding:13px;
    border:1px solid #dce3ee;
    border-radius:10px;
    background:white;
    font-size:15px;
    outline:none;
}

.compare-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2457e6;
    color:white;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.compare-btn:hover{
    background:#1945c2;
}


/* RESULT */

.result{
    display:none;
    background:#fff;
    border:1px solid #e7ebf2;
    border-radius:20px;
    margin:20px 0 40px;
    overflow:hidden;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:18px;
    border-bottom:1px solid #edf0f5;
    text-align:center;
}

th{
    background:#fafbfe;
}

.feature{
    text-align:left;
    font-weight:800;
}

.product-name{
    font-size:18px;
    font-weight:900;
}

.price{
    font-size:21px;
    font-weight:900;
    margin:7px 0;
}

.buy{
    display:inline-block;
    background:#e8f8f1;
    color:#0a8b55;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:900;
}

.wait{
    display:inline-block;
    background:#fff5dd;
    color:#a96d00;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:900;
}

.avoid{
    display:inline-block;
    background:#ffebeb;
    color:#bd3535;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:900;
}

.score{
    color:#2457e6;
    font-size:18px;
    font-weight:900;
}

.bar{
    height:7px;
    background:#edf0f5;
    border-radius:20px;
    margin-top:7px;
}

.bar i{
    display:block;
    height:100%;
    background:#18a66a;
    border-radius:20px;
}


/* EMPTY */

.empty{
    text-align:center;
    padding:30px;
    color:#687386;
}


/* MOBILE */

@media(max-width:700px){

    .hero h1{
        font-size:36px;
    }

    .select-grid{
        grid-template-columns:1fr;
    }

    .result{
        overflow-x:auto;
    }

    table{
        min-width:750px;
    }

}

</style>

</head>

<body>


<!-- NAVBAR -->

<div class="nav">

<div class="wrap nav-inner">

<a class="logo" href="index.html">
Buy<span>Karo</span>YaNahi
</a>

<a class="back" href="index.html">
← Home
</a>

</div>

</div>


<!-- HERO -->

<div class="hero">

<div class="wrap">

<div>
⚖️ PRODUCT COMPARISON
</div>

<h1>
Compare before you
<span>buy.</span>
</h1>

<p>
Do products select karo aur dekho kaunsa better hai.
</p>

</div>

</div>


<div class="wrap">


<!-- SELECT PRODUCTS -->

<div class="select-area">

<h2>
Select Products
</h2>

<div class="select-grid">


<div class="select-box">

<label>
PRODUCT 1
</label>

<select id="product1">

<option value="">
Select Product
</option>

</select>

</div>


<div class="select-box">

<label>
PRODUCT 2
</label>

<select id="product2">

<option value="">
Select Product
</option>

</select>

</div>


</div>


<button
class="compare-btn"
onclick="compareProducts()">

COMPARE NOW

</button>

</div>


<!-- RESULT -->

<div class="result" id="result">

<table>

<thead>

<tr>

<th class="feature">
Feature
</th>

<th id="name1">
Product 1
</th>

<th id="name2">
Product 2
</th>

</tr>

</thead>


<tbody>


<tr>

<td class="feature">
Price
</td>

<td id="price1"></td>

<td id="price2"></td>

</tr>


<tr>

<td class="feature">
Verdict
</td>

<td id="verdict1"></td>

<td id="verdict2"></td>

</tr>


<tr>

<td class="feature">
Worth It Score
</td>

<td>

<div class="score" id="score1"></div>

<div class="bar">
<i id="bar1"></i>
</div>

</td>

<td>

<div class="score" id="score2"></div>

<div class="bar">
<i id="bar2"></i>
</div>

</td>

</tr>


<tr>

<td class="feature">
Performance
</td>

<td id="performance1"></td>

<td id="performance2"></td>

</tr>


<tr>

<td class="feature">
Camera / Quality
</td>

<td id="camera1"></td>

<td id="camera2"></td>

</tr>


<tr>

<td class="feature">
Battery / Efficiency
</td>

<td id="battery1"></td>

<td id="battery2"></td>

</tr>


<tr>

<td class="feature">
Value
</td>

<td id="value1"></td>

<td id="value2"></td>

</tr>


</tbody>

</table>

</div>


<div class="empty" id="empty">

Products select karke
<b>COMPARE NOW</b> dabao.

</div>


</div>


<script>


/* PRODUCT DATABASE */

const products = {

samsung:{

name:"Samsung Galaxy S26",

price:"₹74,999",

verdict:"BUY",

score:88,

performance:"⭐⭐⭐⭐⭐",

camera:"⭐⭐⭐⭐⭐",

battery:"⭐⭐⭐⭐",

value:"⭐⭐⭐⭐"

},

iphone:{

name:"iPhone 17",

price:"₹79,999",

verdict:"BUY",

score:91,

performance:"⭐⭐⭐⭐⭐",

camera:"⭐⭐⭐⭐⭐",

battery:"⭐⭐⭐⭐",

value:"⭐⭐⭐⭐"

},

hp:{

name:"HP Pavilion 15",

price:"₹59,990",

verdict:"WAIT",

score:67,

performance:"⭐⭐⭐⭐",

camera:"⭐⭐⭐",

battery:"⭐⭐⭐⭐",

value:"⭐⭐⭐"

},

lenovo:{

name:"Lenovo IdeaPad Pro",

price:"₹69,990",

verdict:"BUY",

score:86,

performance:"⭐⭐⭐⭐⭐",

camera:"⭐⭐⭐",

battery:"⭐⭐⭐⭐",

value:"⭐⭐⭐⭐"

},

sony:{

name:"Sony WH Series",

price:"₹24,990",

verdict:"BUY",

score:92,

performance:"⭐⭐⭐⭐⭐",

camera:"⭐⭐⭐⭐⭐",

battery:"⭐⭐⭐⭐⭐",

value:"⭐⭐⭐⭐⭐"

},

airpods:{

name:"AirPods",

price:"₹16,990",

verdict:"BUY",

score:88,

performance:"⭐⭐⭐⭐⭐",

camera:"⭐⭐⭐⭐",

battery:"⭐⭐⭐⭐",

value:"⭐⭐⭐⭐"

}

};


/* LOAD PRODUCTS */

const p1=document.getElementById("product1");

const p2=document.getElementById("product2");


for(const key in products){

const option1=document.createElement("option");

option1.value=key;

option1.textContent=products[key].name;

p1.appendChild(option1);


const option2=document.createElement("option");

option2.value=key;

option2.textContent=products[key].name;

p2.appendChild(option2);

}


/* COMPARE */

function compareProducts(){

const key1=p1.value;

const key2=p2.value;


if(!key1 || !key2){

alert("Please select both products.");

return;

}


if(key1===key2){

alert("Please select two different products.");

return;

}


const a=products[key1];

const b=products[key2];


document.getElementById("name1").innerHTML=
a.name;

document.getElementById("name2").innerHTML=
b.name;


document.getElementById("price1").innerHTML=
a.price;

document.getElementById("price2").innerHTML=
b.price;


document.getElementById("verdict1").innerHTML=
verdictBadge(a.verdict);

document.getElementById("verdict2").innerHTML=
verdictBadge(b.verdict);


document.getElementById("score1").innerHTML=
a.score+"/100";

document.getElementById("score2").innerHTML=
b.score+"/100";


document.getElementById("bar1").style.width=
a.score+"%";

document.getElementById("bar2").style.width=
b.score+"%";


document.getElementById("performance1").innerHTML=
a.performance;

document.getElementById("performance2").innerHTML=
b.performance;


document.getElementById("camera1").innerHTML=
a.camera;

document.getElementById("camera2").innerHTML=
b.camera;


document.getElementById("battery1").innerHTML=
a.battery;

document.getElementById("battery2").innerHTML=
b.battery;


document.getElementById("value1").innerHTML=
a.value;

document.getElementById("value2").innerHTML=
b.value;


document.getElementById("result").style.display=
"block";

document.getElementById("empty").style.display=
"none";


document.getElementById("result").scrollIntoView({
behavior:"smooth"
});

}


/* VERDICT */

function verdictBadge(verdict){

if(verdict==="BUY"){

return '<span class="buy">🟢 BUY</span>';

}

if(verdict==="WAIT"){

return '<span class="wait">🟡 WAIT</span>';

}

return '<span class="avoid">🔴 AVOID</span>';

}

</script>


</body>
</html>
