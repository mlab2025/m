<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare | BuyKaroYaNahi</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f9fc;
color:#172033;
}

a{
text-decoration:none;
color:inherit;
}

.wrap{
width:92%;
max-width:1100px;
margin:auto;
}


/* NAV */

.nav{
height:72px;
background:#fff;
border-bottom:1px solid #e7ebf2;
}

.nav-inner{
height:100%;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:24px;
font-weight:900;
}

.logo span{
color:#2457e6;
}

.home{
color:#2457e6;
font-weight:800;
}


/* HERO */

.hero{
text-align:center;
padding:60px 0;
background:linear-gradient(135deg,#eef4ff,#fff);
}

.hero h1{
font-size:48px;
margin:15px 0;
}

.hero h1 span{
color:#2457e6;
}

.hero p{
color:#687386;
}


/* SELECT */

.box{
background:#fff;
border:1px solid #e7ebf2;
border-radius:20px;
padding:25px;
margin:35px 0;
}

.select-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

label{
display:block;
font-size:12px;
font-weight:800;
margin-bottom:7px;
color:#687386;
}

select{
width:100%;
padding:14px;
border:1px solid #dce3ee;
border-radius:10px;
font-size:15px;
background:#fff;
}

button{
width:100%;
padding:14px;
margin-top:18px;
border:0;
border-radius:10px;
background:#2457e6;
color:#fff;
font-weight:900;
cursor:pointer;
}


/* RESULT */

#result{
display:none;
background:#fff;
border:1px solid #e7ebf2;
border-radius:20px;
overflow:hidden;
margin-bottom:40px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:18px;
border-bottom:1px solid #edf0f5;
text-align:center;
}

th{
background:#fafbfe;
}

.feature{
text-align:left;
font-weight:800;
}

.name{
font-size:18px;
font-weight:900;
}

.price{
font-size:21px;
font-weight:900;
margin:7px;
}

.score{
font-size:18px;
font-weight:900;
color:#2457e6;
}

.buy{
color:#0a8b55;
font-weight:900;
}

.wait{
color:#a96d00;
font-weight:900;
}

.avoid{
color:#bd3535;
font-weight:900;
}


/* MOBILE */

@media(max-width:700px){

.hero h1{
font-size:36px;
}

.select-grid{
grid-template-columns:1fr;
}

#result{
overflow-x:auto;
}

table{
min-width:700px;
}

}

</style>

</head>


<body>


<!-- NAV -->

<div class="nav">

<div class="wrap nav-inner">

<a class="logo" href="index.html">
Buy<span>Karo</span>YaNahi
</a>

<a class="home" href="index.html">
← Home
</a>

</div>

</div>


<!-- HERO -->

<div class="hero">

<div class="wrap">

<div>⚖️ PRODUCT COMPARISON</div>

<h1>
Compare before you
<span>buy.</span>
</h1>

<p>
Do products select karo aur dekho kaunsa better hai.
</p>

</div>

</div>


<div class="wrap">


<!-- SELECT -->

<div class="box">

<h2>
Select Products
</h2>

<div class="select-grid">

<div>

<label>
PRODUCT 1
</label>

<select id="p1">

<option value="">
Select Product
</option>

<option value="s26">
Samsung Galaxy S26
</option>

<option value="iphone17">

</option>

<option value="hp15">
HP Pavilion 15
</option>

<option value="lenovo">
Lenovo IdeaPad Pro
</option>

<option value="sony">
Sony WH Series
</option>

<option value="airpods">
AirPods
</option>

</select>

</div>


<div>

<label>
PRODUCT 2
</label>

<select id="p2">

<option value="">
Select Product
</option>

<option value="s26">
Samsung Galaxy S26
</option>

<option value="iphone17">
iPhone 17
</option>

<option value="hp15">
HP Pavilion 15
</option>

<option value="lenovo">
Lenovo IdeaPad Pro
</option>

<option value="sony">
Sony WH Series
</option>

<option value="airpods">
AirPods
</option>

</select>

</div>

</div>


<button onclick="compare()">
COMPARE NOW
</button>

</div>


<!-- RESULT -->

<div id="result">

<table>

<thead>

<tr>

<th class="feature">
Feature
</th>

<th id="name1">
Product 1
</th>

<th id="name2">
Product 2
</th>

</tr>

</thead>


<tbody>

<tr>

<td class="feature">
Price
</td>

<td id="price1"></td>

<td id="price2"></td>

</tr>


<tr>

<td class="feature">
Worth It Score
</td>

<td id="score1"></td>

<td id="score2"></td>

</tr>


<tr>

<td class="feature">
Verdict
</td>

<td id="verdict1"></td>

<td id="verdict2"></td>

</tr>


<tr>

<td class="feature">
Performance
</td>

<td id="performance1"></td>

<td id="performance2"></td>

</tr>


<tr>

<td class="feature">
Camera / Quality
</td>

<td id="camera1"></td>

<td id="camera2"></td>

</tr>


<tr>

<td class="feature">
Battery / Efficiency
</td>

<td id="battery1"></td>

<td id="battery2"></td>

</tr>


<tr>

<td class="feature">
Value
</td>

<td id="value1"></td>

<td id="value2"></td>

</tr>


</tbody>

</table>

</div>

</div>


<script>


const data={


s26:{
name:"Samsung Galaxy S26",
price:"₹74,999",
score:88,
verdict:"BUY",
performance:"⭐⭐⭐⭐⭐",
camera:"⭐⭐⭐⭐⭐",
battery:"⭐⭐⭐⭐",
value:"⭐⭐⭐⭐"
},


iphone17:{
name:"iPhone 17",
price:"₹79,999",
score:91,
verdict:"BUY",
performance:"⭐⭐⭐⭐⭐",
camera:"⭐⭐⭐⭐⭐",
battery:"⭐⭐⭐⭐",
value:"⭐⭐⭐⭐"
},


hp15:{
name:"HP Pavilion 15",
price:"₹59,990",
score:67,
verdict:"WAIT",
performance:"⭐⭐⭐⭐",
camera:"⭐⭐⭐",
battery:"⭐⭐⭐⭐",
value:"⭐⭐⭐"
},


lenovo:{
name:"Lenovo IdeaPad Pro",
price:"₹69,990",
score:86,
verdict:"BUY",
performance:"⭐⭐⭐⭐⭐",
camera:"⭐⭐⭐",
battery:"⭐⭐⭐⭐",
value:"⭐⭐⭐⭐"
},


sony:{
name:"Sony WH Series",
price:"₹24,990",
score:92,
verdict:"BUY",
performance:"⭐⭐⭐⭐⭐",
camera:"⭐⭐⭐⭐⭐",
battery:"⭐⭐⭐⭐⭐",
value:"⭐⭐⭐⭐⭐"
},


airpods:{
name:"AirPods",
price:"₹16,990",
score:88,
verdict:"BUY",
performance:"⭐⭐⭐⭐⭐",
camera:"⭐⭐⭐⭐",
battery:"⭐⭐⭐⭐",
value:"⭐⭐⭐⭐"
}

};


function compare(){

const a=
document.getElementById("p1").value;

const b=
document.getElementById("p2").value;


if(!a || !b){

alert("Dono products select karo.");

return;

}


if(a===b){

alert("Do alag products select karo.");

return;

}


const x=data[a];

const y=data[b];


document.getElementById("name1").innerHTML=x.name;

document.getElementById("name2").innerHTML=y.name;


document.getElementById("price1").innerHTML=x.price;

document.getElementById("price2").innerHTML=y.price;


document.getElementById("score1").innerHTML=
x.score+"/100";

document.getElementById("score2").innerHTML=
y.score+"/100";


document.getElementById("verdict1").innerHTML=
badge(x.verdict);

document.getElementById("verdict2").innerHTML=
badge(y.verdict);


document.getElementById("performance1").innerHTML=
x.performance;

document.getElementById("performance2").innerHTML=
y.performance;


document.getElementById("camera1").innerHTML=
x.camera;

document.getElementById("camera2").innerHTML=
y.camera;


document.getElementById("battery1").innerHTML=
x.battery;

document.getElementById("battery2").innerHTML=
y.battery;


document.getElementById("value1").innerHTML=
x.value;

document.getElementById("value2").innerHTML=
y.value;


document.getElementById("result").style.display=
"block";


document.getElementById("result")
.scrollIntoView({
behavior:"smooth"
});

}


function badge(v){

if(v==="BUY")
return '<span class="buy">🟢 BUY</span>';

if(v==="WAIT")
return '<span class="wait">🟡 WAIT</span>';

return '<span class="avoid">🔴 AVOID</span>';

}

</script>


</body>

</html>
